name: ESP-IDF Build

on:
  push:
    branches: [ master, main, 'claude/**' ]
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.14.0'

      - name: Build web dist (produces gzipped Angular assets for www.bin)
        working-directory: ./main/http_server/axe-os
        run: |
          npm ci
          npm run build

      - name: esp-idf build (produces esp-miner.bin and www.bin)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.3
          target: esp32s3
          command: GITHUB_ACTIONS="true" idf.py build
          path: '.'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'

      - run: pip install esptool

      - name: Create factory/merged image
        run: ./merge_bin.sh ./esp-miner-merged.bin

      - name: Upload flashable firmware (esp-miner.bin + www.bin + factory image)
        uses: actions/upload-artifact@v4
        with:
          name: esp-miner-firmware
          path: |
            build/esp-miner.bin
            build/www.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            esp-miner-merged.bin
          retention-days: 30
